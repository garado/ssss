name: ssss
assets:
  - assets/*
functions:
  cycleTheme:
    path: ./src/main.ts:cycleTheme
    command:
      name: "SSSS: Cycle Theme"

  setTheme:
    path: ./src/main.ts:setTheme
    command:
      name: "SSSS: Set Theme"

  applyStoredTheme:
    path: ./src/main.ts:applyStoredTheme
    events:
      - editor:init
