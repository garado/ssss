name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # full history so --generate-notes can diff against the previous tag
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # @silverbulletmd/silverbullet requires node >=24.13.0
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # release assets must be flat filenames for the
      # releases/latest/download/<name> URLs to work, so stage them in one dir
      - name: stage release assets
        run: |
          mkdir -p dist
          cp ssss.plug.js dist/
          cp assets/table-editor/table-editor.js dist/
          cp assets/table-editor/table-resize.js dist/
          cp assets/table-editor/table-editor.css dist/
          cp assets/vim-clipboard/vim-clipboard.js dist/
          for f in dist/*; do
            test -s "$f" || { echo "missing or empty: $f" >&2; exit 1; }
          done
          ls -l dist

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
